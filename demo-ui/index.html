        <h1>Hàm mất mát: mô hình sai bao nhiêu?</h1>
        <p class="lead">Để cải thiện một mô hình, trước hết chúng ta cần một cách đo mức độ chênh lệch giữa giá trị dự đoán và giá trị thực tế.</p>
        <div class="lesson-info"><span>◷ 12 phút đọc</span><span>◇ Mức độ cơ bản</span><button>☆ Lưu bài học</button></div>
        <hr>
        <h2>Từ sai số đến hàm mất mát</h2>
        <p>Giả sử mô hình dự đoán một căn nhà có giá 2,1 tỷ đồng, trong khi giá thực tế là 2,4 tỷ đồng. Khoảng cách 0,3 tỷ đồng cho biết dự đoán chưa chính xác. Với nhiều mẫu dữ liệu, ta cần tổng hợp các khoảng cách này thành một con số duy nhất.</p>
        <div class="formula-card">
          <span>SAI SỐ BÌNH PHƯƠNG TRUNG BÌNH</span>
          <div>MSE = <span class="fraction"><b>1</b><i>n</i></span> <em>Σ</em> (y<sub>i</sub> − ŷ<sub>i</sub>)<sup>2</sup></div>
          <p>MSE càng nhỏ, đường hồi quy càng phù hợp với dữ liệu quan sát.</p>
        </div>
        <div class="insight-box"><i>!</i><div><b>Vì sao phải bình phương sai số?</b><p>Phép bình phương loại bỏ dấu âm và khiến các dự đoán sai lệch lớn bị “phạt” nhiều hơn. Nhờ đó, mô hình có xu hướng tránh những sai số quá lớn.</p></div></div>
        <h2>Quan sát trên dữ liệu</h2>
        <div class="lesson-chart-card">
          <div class="chart-caption"><b>Mối quan hệ giữa diện tích và giá nhà</b><span><i class="dot actual"></i>Giá thực tế <i class="line"></i>Đường dự đoán</span></div>

            <path d="M85 209L640 47" stroke="#ef9f2d" stroke-width="4" stroke-linecap="round"/>
            <g stroke="#3e7f8b" stroke-width="2" stroke-dasharray="3 3"><path d="M135 182V196"/><path d="M245 157V168"/><path d="M360 112V135"/><path d="M470 104V101"/><path d="M580 62V69"/></g>
            <g fill="#087c86" stroke="white" stroke-width="3"><circle cx="135" cy="182" r="7"/><circle cx="245" cy="157" r="7"/><circle cx="360" cy="112" r="7"/><circle cx="470" cy="104" r="7"/><circle cx="580" cy="62" r="7"/></g>
            <g fill="#718084" font-size="12" font-family="Segoe UI"><text x="40" y="235">0</text><text x="120" y="250">50</text><text x="230" y="250">75</text><text x="338" y="250">100</text><text x="450" y="250">125</text><text x="560" y="250">150</text><text x="310" y="268">Diện tích (m²)</text></g>
          </svg>
        </div>
        <div class="lesson-footer-actions"><button class="ghost-btn">← Bài trước</button><a class="primary-btn" href="?view=playground">Tiếp tục: Gradient Descent <span>→</span></a></div>
      </article>
      <aside class="lesson-outline">
        <span>TRONG BÀI NÀY</span>
        <a class="active" href="#">Từ sai số đến hàm mất mát</a><a href="#">Quan sát trên dữ liệu</a><a href="#">Ảnh hưởng của ngoại lệ</a><a href="#">Tóm tắt</a>
